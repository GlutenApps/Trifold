name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Both desktop platforms (ADR 0006): lint, typecheck and unit tests are OS-neutral, but the
    # smoke test drives the real Electron app, so it runs on each.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm fetch:content
        continue-on-error: true
      - run: pnpm smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-results-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
