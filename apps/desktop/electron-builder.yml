appId: app.trifold.desktop
productName: Trifold
copyright: Copyright © 2026 Trifold contributors
directories:
  output: ../../dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
extraResources:
  - from: ../../resources
    to: resources
    filter:
      - '**/*'
      - '!README.md'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# macOS: a dmg and a zip for the build machine's architecture (ADR 0006). better-sqlite3 is
# fetched for that one architecture by scripts/rebuild-native.mjs, so a universal build needs
# both prebuilds and is not attempted. Builds are unsigned until a Developer ID exists; the
# first launch is right-click → Open.
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  identity: null
  hardenedRuntime: false
  darkModeSupport: true
dmg:
  writeUpdateInfo: false
# Native modules are prepared by scripts/rebuild-native.mjs (ADR 0001).
npmRebuild: false
