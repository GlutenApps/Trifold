appId: app.trifold.desktop
productName: Trifold
copyright: Copyright © 2026 Trifold contributors
directories:
  output: ../../dist
  buildResources: build
# Icons and installer art come from the brand kit (docs/brand/BRAND.md §3-4) and are copied into
# build/ as they are, except icon.ico: `pnpm make:ico` packs the kit's bare on-dark marks into it
# (transparent, no tile, size-tuned below 48 px), so Windows uses it instead of icon.png.
files:
  - out/**/*
  - package.json
  # better-sqlite3 ships its C sources in the npm package; only the prebuilt binary is needed.
  - '!node_modules/better-sqlite3/{deps,src}/**'
asarUnpack:
  - '**/*.node'
# Bundled content (resources/, fetched by `pnpm fetch:content`; scripts/check-content.mjs refuses
# to build without it) and the font licences, which the OFL requires to travel with the fonts.
extraResources:
  - from: ../../resources
    to: resources
    filter:
      - '**/*'
      - '!README.md'
  - from: src/renderer/assets/fonts
    to: licenses
    filter:
      - '*-OFL.txt'
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Welcome and finish pages show the stacked lockup on the sidebar; inner pages carry the header
  # with the mark. The welcome page itself is added by build/installer.nsh.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  artifactName: ${productName}-Setup-${version}-win-${arch}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}-win-${arch}.${ext}
  # Unpack once into %TEMP%/Trifold and reuse it, instead of extracting 200 MB on every launch.
  unpackDirName: Trifold
# macOS: a dmg and a zip for the build machine's architecture (ADR 0006). better-sqlite3 is
# fetched for that one architecture by scripts/rebuild-native.mjs, so a universal build needs
# both prebuilds and is not attempted. There is no Developer ID yet, so the bundle is ad-hoc
# signed ("-"): Gatekeeper then shows the ordinary unidentified-developer prompt. Leaving
# identity null would skip signing altogether and a downloaded build would report "damaged".
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: false
  darkModeSupport: true
  icon: build/icon.icns
dmg:
  writeUpdateInfo: false
  background: build/background.png
# Native modules are prepared by scripts/rebuild-native.mjs (ADR 0001).
npmRebuild: false
