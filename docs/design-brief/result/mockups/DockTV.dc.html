<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV controls tool</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens/tf.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="tf pnl db" style="width: {{w}}px; height: {{h}}px; gap: 8px">
  <div class="cd lv" style="padding: 8px 12px; display: flex; flex-direction: column; gap: 2px">
    <div class="row" style="gap: 6px"><span class="pip"></span><span class="cp" style="color: #E3D3B0">Live on TV</span><div class="sp"></div><span class="bd">window open</span></div>
    <div class="row" style="gap: 6px"><span class="b tr">Silt Springs Map</span><span class="mu s12 tr">· map · title shown</span></div>
  </div>
  <div class="wrap" style="gap: 6px">
    <div class="btn sm" title="Toggle blackout · Ctrl+Shift+B"><svg class="i s" viewBox="0 0 24 24"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"></path></svg>Blackout</div>
    <div class="btn sm" title="Close the player window · Ctrl+Shift+P"><svg class="i s" viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 9h18"></path></svg>Close player window</div>
    <div class="ib bd" title="Undo last scene · Ctrl+Shift+Z"><svg class="i" viewBox="0 0 24 24"><path d="M4 10h10a5 5 0 0 1 0 10H9M4 10l4-4M4 10l4 4"></path></svg></div>
    <div class="ib bd dim" title="Dismiss handout (none shown)"><svg class="i" viewBox="0 0 24 24"><path d="M3 4h18v16H3zM9 9l6 6M15 9l-6 6"></path></svg></div>
    <div class="ib bd dim" title="End break (no break running)"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2M6 3v2M10 3v2M14 3v2"></path></svg></div>
  </div>
  <div class="col" style="gap: 4px">
    <span class="lb">Overlays</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; font-size: 12px">
      <div class="row" style="gap: 6px"><span class="chk on"><svg class="i s" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"></path></svg></span>Scene title</div>
      <div class="row" style="gap: 6px"><span class="chk on"><svg class="i s" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"></path></svg></span>Initiative strip</div>
      <div class="row" style="gap: 6px"><span class="chk"></span>PC health bars</div>
      <div class="row" style="gap: 6px"><span class="chk on"><svg class="i s" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"></path></svg></span>Round counter</div>
    </div>
  </div>
  <div class="col" style="gap: 4px">
    <div class="row"><span class="lb">Handout</span><span class="dft" title="Typed, not shown yet"></span></div>
    <div class="row" style="gap: 6px"><div class="in sm" style="width: 110px">The letter</div><div class="in sm ta sp" style="min-height: 26px; padding: 4px 8px">Meet me at the springs before the tide turns.</div></div>
    <div class="row" style="gap: 6px"><div class="btn sm pri">Show text handout</div><div class="btn sm">Show image handout…</div></div>
  </div>
  <div class="col" style="gap: 4px">
    <span class="lb">Break</span>
    <div class="row" style="gap: 6px"><div class="in sm sp">Back in</div><div class="in sm m n" style="width: 64px; justify-content: space-between">10<span class="mu s11">min</span></div><div class="btn sm">Show break screen</div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":282},"h":{"editor":"int","default":344},"$preview":{"width":282,"height":344}}'>
class Component extends DCLogic {
  renderVals() { const p = this.props; return { w: Number(p.w ?? 282), h: Number(p.h ?? 344) }; }
}
</script>
</body>
</html>
