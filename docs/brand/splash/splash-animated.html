<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Trifold</title>
    <style>
      :root {
        --slate: #14181d;
        --surface: #1c2229;
        --text: #e6e1d6;
        --muted: #9aa3ad;
        --rust: #c45c45;
        --turn: 1.8s; /* one 120° turn plus its pause */
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: radial-gradient(120% 90% at 50% 40%, var(--surface) 0%, var(--slate) 70%);
        display: grid;
        place-items: center;
        overflow: hidden;
        user-select: none;
        cursor: default;
        -webkit-app-region: drag; /* the frameless splash window can be dragged */
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: appear 420ms ease-out both;
      }
      .lockup {
        width: min(46vw, 300px);
        height: auto;
        overflow: visible;
      }
      .frame path {
        fill: var(--text);
      }
      .core path,
      .dot {
        fill: var(--rust);
      }
      .txt {
        fill: var(--text);
      }

      /* The frame has three-fold symmetry, so turning it 120° lands it exactly where it started:
     each loop is one smooth turn followed by a short rest, and the repeat is seamless. */
      .frame {
        transform-box: view-box;
        animation: turn var(--turn) cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes turn {
        0% {
          transform: rotate(0deg);
        }
        72% {
          transform: rotate(120deg);
        }
        100% {
          transform: rotate(120deg);
        }
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .status {
        min-height: 1.4em;
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 0.01em;
        opacity: 0;
        transition: opacity 200ms;
      }
      .status.on {
        opacity: 1;
      }

      /* Reduced motion: no spinning, just a slow breathe on the frame */
      @media (prefers-reduced-motion: reduce) {
        .frame {
          animation: breathe 2.4s ease-in-out infinite;
        }
        .stage {
          animation: none;
        }
        @keyframes breathe {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.55;
          }
        }
      }
    </style>
  </head>

    <script>
      // Optional: the main process can show a short status line, e.g.
      //   splash.webContents.executeJavaScript('setSplashStatus("Indexing compendium…")')
      window.setSplashStatus = function (text) {
        var el = document.getElementById('status');
        el.textContent = text || '';
        el.classList.toggle('on', !!text);
      };
    </script>
